version: '3.8'

services:
  api:
    build: .
    container_name: escolar-api
    ports:
      - "8181:8181"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=pipacombatente
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - API_SECURITY_TOKEN_SECRET=chave
      - SERVER_PORT=8181
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: escolar-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pipacombatente
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: